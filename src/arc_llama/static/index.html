<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Model Manager — arc-llama</title>
<link rel="stylesheet" href="/style.css" />
</head>
<body>
<header>
  <div class="brand">
    <h1>arc-llama</h1>
    <span class="tagline">Model Manager</span>
  </div>
  <div class="meta">
    <span class="meta-badge"><span class="label">server</span><span id="server-info">—</span></span>
    <span class="meta-badge"><span class="label">policy</span><span id="policy-info">—</span></span>
    <a class="chat-link" href="/chat">Chat &rarr;</a>
    <button id="scan" class="primary">Scan for models</button>
    <button id="refresh" class="secondary">Refresh</button>
    <button id="stop-all" class="danger">Stop all</button>
  </div>
</header>

<main>
  <section>
    <div class="section-head">
      <h2>GPUs</h2>
      <span class="section-hint">Detected accelerator devices</span>
    </div>
    <div class="card">
      <table id="gpus">
        <thead>
          <tr>
            <th>PCI</th>
            <th>Arch</th>
            <th>Name</th>
            <th>SYCL</th>
            <th>VRAM</th>
            <th>Enabled</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>

  <section>
    <div class="section-head">
      <h2>Models</h2>
      <span class="section-hint">Local and upstream model endpoints</span>
    </div>
    <div class="card">
      <table id="models">
        <thead>
          <tr>
            <th>Status</th>
            <th>Name</th>
            <th>GPU</th>
            <th>Port</th>
            <th>ctx</th>
            <th>K / V</th>
            <th>Path</th>
            <th></th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<footer id="status-footer">
  <span class="status-dot"></span>
  <span id="last-updated">never refreshed</span>
  <span class="dot"></span>
  <span>polling every 5s</span>
</footer>

<script src="/app.js"></script>
</body>
</html>
